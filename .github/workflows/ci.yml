name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build (warnings are errors)
        run: forge build --sizes

      - name: Unit / integration / fuzz tests
        run: forge test -vvv

      - name: Gas snapshot (fails on regression)
        run: forge snapshot --check --tolerance 1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Generate coverage
        # Deliberately NOT --ir-minimum. It compiles, but its source mapping is
        # lossy: it reported ~14 executed lines as uncovered, including whole
        # function bodies that tests demonstrably reach. Add it back only if this
        # build starts hitting "stack too deep", and re-verify the numbers if so.
        # Invariant suites are excluded: they distort line coverage without signal.
        run: forge coverage --no-match-path "test/invariant/**" --report lcov --report summary

      - uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  static-analysis:
    name: Slither
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          fail-on: medium
          slither-args: --filter-paths "lib/|test/|script/"
